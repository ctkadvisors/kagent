SPDX-License-Identifier: MIT
Copyright (c) 2026 Chris Knuteson

RBAC needed only when the tool gateway is configured to broker code
sessions through kubernetes-sigs/agent-sandbox SandboxClaim objects.
*/}}
{{- if and .Values.toolRuntime.enabled (or .Values.toolRuntime.code.agentSandbox.enabled .Values.toolRuntime.code.sandbox.enabled) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kagent-operator.fullname" . }}-tool-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent-operator.fullname" . }}-tool-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
rules:
  {{- if .Values.toolRuntime.code.sandbox.enabled }}
  # Per-task sandbox Jobs (tool-gateway pod-code-runner.ts): create one per task,
  # remove a task's old ones, find the running pod's IP.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "deletecollection", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.toolRuntime.code.agentSandbox.enabled }}
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kagent-operator.fullname" . }}-tool-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "kagent-operator.fullname" . }}-tool-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kagent-operator.fullname" . }}-tool-gateway
{{- end }}
