name: docker builds through verdaccio (throwaway proof)
on: pull_request

jobs:
  via-verdaccio:
    name: build ${{ matrix.name }} (npmjs blocked)
    runs-on: homelab
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: operator, file: packages/operator/Dockerfile }
          - { name: agent-pod, file: packages/agent-pod/Dockerfile }
          - { name: workbench-api, file: packages/workbench-api/Dockerfile }
          - { name: workbench-ui, file: packages/workbench-ui/Dockerfile }
          - { name: llm-gateway, file: packages/llm-gateway/Dockerfile }
          - { name: tool-gateway, file: packages/tool-gateway/Dockerfile }
          - { name: channel-whatsapp-adapter, file: packages/channel-whatsapp-adapter/Dockerfile }
          - { name: channel-telegram-adapter, file: packages/channel-telegram-adapter/Dockerfile }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Cold build with the registry arg and npmjs blocked
        run: |
          start=$(date +%s)
          docker buildx build --no-cache --platform linux/amd64 -f ${{ matrix.file }} \
            --build-arg npm_config_registry=http://verdaccio.verdaccio.svc.cluster.local:4873/ \
            --build-arg COREPACK_NPM_REGISTRY=http://verdaccio.verdaccio.svc.cluster.local:4873 \
            --add-host registry.npmjs.org:127.0.0.1 --add-host registry.yarnpkg.com:127.0.0.1 \
            --output type=cacheonly .
          echo "BUILT VIA VERDACCIO ${{ matrix.name }}: $(( $(date +%s) - start ))s"
  control:
    name: control (must fail)
    runs-on: homelab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Same blocked build WITHOUT the registry arg
        run: |
          if docker buildx build --no-cache --platform linux/amd64 -f packages/channel-telegram-adapter/Dockerfile \
               --add-host registry.npmjs.org:127.0.0.1 --add-host registry.yarnpkg.com:127.0.0.1 --output type=cacheonly . ; then
            echo "CONTROL DID NOT FAIL: the host block is not effective inside builds"; exit 1
          else
            echo "CONTROL OK: the build fails when npmjs is blocked and no registry arg is given"
          fi
